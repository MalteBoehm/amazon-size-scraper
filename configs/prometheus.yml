global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'amazon-scraper'
    static_configs:
      - targets: ['localhost:2112']
    metric_relabel_configs:
      # Optional: Add relabeling rules if needed
      - source_labels: [__name__]
        regex: 'scraper_.*'
        action: keep

# Alerting rules can be defined in separate files
rule_files:
  - 'alerts/*.yml'

