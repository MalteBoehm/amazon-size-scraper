version: "3.8"

services:
  # Size Scraper Application
  size-scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: amazon-scraper
    environment:
      # Database
      DB_HOST: ${DB_HOST:-49.13.49.90}
      DB_PORT: ${DB_PORT:-5111}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-m5DAUj3AC1VGdLf0bamLSYesXKlYraZgq4e21qHp4NLIrO4t1mLfHI44WkEr0OQL}
      DB_NAME: ${DB_NAME:-amazon_scraper}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}

      # Redis
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # Scraper Configuration
      SCRAPER_RATE_LIMIT_MIN: ${SCRAPER_RATE_LIMIT_MIN:-5s}
      SCRAPER_RATE_LIMIT_MAX: ${SCRAPER_RATE_LIMIT_MAX:-30s}
      SCRAPER_CONCURRENT_LIMIT: ${SCRAPER_CONCURRENT_LIMIT:-2}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}

      # Browser Configuration
      BROWSER_HEADLESS: ${BROWSER_HEADLESS:-true}
      BROWSER_TIMEOUT: ${BROWSER_TIMEOUT:-30s}
      BROWSER_VIEWPORT_WIDTH: ${BROWSER_VIEWPORT_WIDTH:-1920}
      BROWSER_VIEWPORT_HEIGHT: ${BROWSER_VIEWPORT_HEIGHT:-1080}
      BROWSER_ACCEPT_LANGUAGE: ${BROWSER_ACCEPT_LANGUAGE:-de-DE,de;q=0.9,en;q=0.8}
      BROWSER_TIMEZONE: ${BROWSER_TIMEZONE:-Europe/Berlin}
      BROWSER_LOCALE: ${BROWSER_LOCALE:-de-DE}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DEBUG_MODE: ${DEBUG_MODE:-false}
      SCRAPER_LOG_HTML: ${SCRAPER_LOG_HTML:-false}
      SCRAPER_HTML_LOG_DIR: ${SCRAPER_HTML_LOG_DIR:-/app/logs/html}

      # Proxy Configuration
      USE_PROXIES: ${USE_PROXIES:-false}
      PROXY_LIST_FILE: ${PROXY_LIST_FILE:-/app/proxy_data/proxy_list}

      # Server Configuration
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8084}

    ports:
      - "${SERVER_PORT:-8084}:8084"
    volumes:
      - ./proxy_list:/app/proxy_data/proxy_list:ro
      - scraper_logs:/app/logs
      - /dev/shm:/dev/shm # Shared memory for Playwright
    networks:
      - kopers-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8084/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Lifecycle Consumer for processing events
  lifecycle-consumer:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: amazon-scraper-consumer
    entrypoint: ["/app/lifecycle-consumer"]
    environment:
      # Database
      DB_HOST: ${DB_HOST:-49.13.49.90}
      DB_PORT: ${DB_PORT:-5111}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-m5DAUj3AC1VGdLf0bamLSYesXKlYraZgq4e21qHp4NLIrO4t1mLfHI44WkEr0OQL}
      DB_NAME: ${DB_NAME:-amazon_scraper}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}

      # Redis
      REDIS_ADDR: ${REDIS_ADDR:-49.13.49.90:3020}
      REDIS_HOST: ${REDIS_HOST:-49.13.49.90}
      REDIS_PORT: ${REDIS_PORT:-3020}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pass}
      REDIS_STREAM: ${REDIS_STREAM:-stream:product_lifecycle}

      # Scraper URL for API calls
      SCRAPER_URL: ${SCRAPER_URL:-http://amazon-scraper:8084}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

    networks:
      - kopers-network
    restart: unless-stopped

networks:
  kopers-network:
    external: true

volumes:
  scraper_logs:
    name: amazon-scraper-logs
